server {
    listen ${PORT};

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend when VITE_API_URL is not set (local Docker Compose)
    location /api/ {
        # Resolve the backend at request time (not at startup) so nginx does not
        # crash with "host not found in upstream" if the backend isn't resolvable yet.
        resolver ${DNS_RESOLVER} valid=10s ipv6=off;
        set $backend_upstream http://${BACKEND_HOST}:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    }
}
